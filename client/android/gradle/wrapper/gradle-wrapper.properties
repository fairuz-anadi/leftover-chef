distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
# The stock ten seconds loses this download on any ordinary connection, and the
# failure names the timeout rather than the fix. scripts/build-apk.ps1 repoints
# this line at the local copy that scripts/setup-android.ps1 downloads, which
# is why this file shows as modified after a build. That change is local: it is
# one machine's absolute path and does not belong in a commit.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
