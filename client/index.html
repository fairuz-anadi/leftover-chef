<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page reach under the notch and the home
      indicator; index.css pays that back with safe-area padding. Without it an
      installed app sits in a white letterbox on any recent phone.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Photograph your fridge. FridgeMama names what is inside, tracks how long it has left, and tells you what to cook before it spoils."
    />
    <title>FridgeMama — detect, track and cook before it spoils</title>

    <!-- ── Installable app ─────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d92d20" />
    <meta name="application-name" content="FridgeMama" />

    <!--
      iOS reads none of the manifest. The tags below are the only way Safari
      knows to open this full-screen under our own icon, and they have to sit
      in the markup — added from JavaScript they are ignored.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FridgeMama" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
