name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kitchen_host:
        description: 'Default Kitchen Host IP (e.g. 192.168.0.203 or leave blank to enter on phone)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build FridgeMama APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Web Client
        working-directory: ./client
        env:
          VITE_KITCHEN_HOST: ${{ github.event.inputs.kitchen_host || '' }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./client
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x client/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK for distribution
        run: |
          mkdir -p output
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output/FridgeMama.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridgeMama-APK
          path: output/FridgeMama.apk
          retention-days: 14

      - name: Publish GitHub Release with Direct APK Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: mobile-latest
          name: "FridgeMama Mobile APK Build"
          body: |
            ## 📱 FridgeMama Android APK Download

            Direct download link for your phone:
            👉 **[Download FridgeMama.apk](https://github.com/${{ github.repository }}/releases/download/mobile-latest/FridgeMama.apk)**

            ### How to run on your phone:
            1. Open the download link on your Android phone.
            2. Tap the downloaded file to install (allow "Install Unknown Apps" in phone Settings if prompted).
            3. Connect your phone to the same Wi-Fi as your laptop.
            4. Start the laptop server: `./scripts/start-demo.sh`
            5. In the FridgeMama app on your phone, enter your laptop's IP address (shown in the terminal) to connect!
          draft: false
          prerelease: false
          files: output/FridgeMama.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
